<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 48" fill="none">
  <defs>
    <!-- Metallic Gold Gradient for Emblem Icon Only -->
    <linearGradient id="credifyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE599" />
      <stop offset="45%" stop-color="#F5C542" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
    
    <!-- Subtle Inner Gold Glow -->
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFF5D6" />
    </linearGradient>

    <!-- Drop Shadow for Icon Depth -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F5C542" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Premium Gold Emblem Icon -->
  <g filter="url(#iconGlow)">
    <!-- Outer Shield Diamond Frame -->
    <path d="M 22 7 L 35 15 L 35 31 L 22 39 L 9 31 L 9 15 Z" 
          stroke="url(#credifyGold)" 
          stroke-width="2.2" 
          fill="#131313" 
          stroke-linejoin="round" />
    
    <!-- Interlocking Arc forming stylized C -->
    <path d="M 27 16 C 18 16 15 21 15 23 C 15 25 18 30 27 30" 
          stroke="url(#credifyGold)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none" />
    
    <!-- Upward Growth Core Node -->
    <circle cx="23" cy="23" r="2.8" fill="url(#innerGlow)" />
    
    <!-- Top Spark Accent -->
    <path d="M 22 6 L 22 9" stroke="#FFF5D6" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Clean Single-Color Warm-White Wordmark: CREDIFY (#F5F5F0) -->
  <text x="44" y="30" font-family="'Manrope', 'Inter', sans-serif" font-weight="800" font-size="21" letter-spacing="0.06em" fill="#F5F5F0">
    CREDIFY
  </text>
</svg>
