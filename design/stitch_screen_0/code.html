<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
        }
        .glass-panel {
            background: rgba(26, 26, 26, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid #2a2a2a;
        }
        .glow-effect:focus-within {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
        }
        
        /* Subtle background animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .ambient-shape {
            position: absolute;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
        }
    </style>

<body class="min-h-screen flex items-center justify-center p-4 md:p-margin-desktop relative overflow-x-hidden">
<!-- Ambient Background Lighting -->
<div class="ambient-shape w-[600px] h-[600px] bg-primary-container top-[-20%] left-[-10%]"></div>
<div class="ambient-shape w-[500px] h-[500px] bg-outline-variant bottom-[-10%] right-[-10%]" style="animation-delay: -10s;"></div>
<div class="w-full max-w-lg glass-panel rounded-xl p-6 md:p-10 shadow-2xl relative z-10">
<!-- Brand / Header -->
<div class="text-center mb-stack-md">
<div class="flex justify-center mb-4"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmpoTVCqDFzk70IYZ_tzohogQZ3UMUoB1wfbb90h102vkg6miHtqXIAdUoEz4N4z-hyPeOT5iXT-ae6y8rnKRsceKFVLUsH9vzTa2ZOXYmosYFuv1rzL5xlEBkMZdQG_urDytqCkwrX-egZRky5gtEP9dioEajIRN-Li_KAzepaRpC7Z_QMBhRxWNDevXQkBuzcc3IP7w1vE7rb2ioxiYM-OW7iTMoyAI9soDi-4nWuu_pehGMXYVo" alt="Credify Premium Logo" class="h-24 w-auto object-contain"></div>
<h2 class="font-headline-md text-headline-md text-on-surface">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Join the elite network of precision wealth management.</p>
</div>
<form class="space-y-stack-sm md:space-y-stack-md">
<!-- Profile Picture Upload -->
<div class="flex flex-col items-center justify-center space-y-4 mb-stack-md">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full border-2 border-outline-variant group-hover:border-primary-container transition-colors duration-300 overflow-hidden bg-surface-container-high flex items-center justify-center relative">
<!-- Placeholder Image -->
<img class="w-full h-full object-cover opacity-50" data-alt="A professional, minimalist blank user avatar placeholder in a dark luxury style. Subtle gradient background from deep charcoal to black, with a refined, metallic gold outline of a person's silhouette. Studio lighting effect, extremely clean, high-end fintech aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbl44iKYVeaoCD5GHRfSIsgOEEgjAHIGOsGBqMKfX9aW577D2_tch5M7NshjX38K0rDF7Lo_ROgVpsd6wnAVO2ftEZODD7M-QA1JzxW6Nji7jQW8ucolQZfPDnxY2KIDsJKXc3EnRFLx_Kx57zdWNIpLEpORaV3extvwrOnay13QdhoXoRXwdHZssUrbAVsgLNM9xjso7PU-_Ft_U2vag6b0a9tVxTLIwDRZnDWUeSU2kqWu9v0Ehz">
<div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
</div>
</div>
<div class="flex gap-4">
<button class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors uppercase tracking-widest" type="button">Upload</button>
<button class="font-label-sm text-label-sm text-on-surface-variant hover:text-error transition-colors uppercase tracking-widest" type="button">Remove</button>
</div>
</div>
<!-- Input Fields -->
<div class="space-y-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-widest" for="fullName">Full Name</label>
<div class="relative glow-effect rounded-md transition-all duration-300 border border-surface-container-high bg-[#0D0D0D]">
<input class="w-full bg-transparent border-none text-on-surface font-body-md text-body-md focus:ring-0 py-3 px-4 placeholder-on-surface-variant/50" id="fullName" placeholder="John Doe" type="text">
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-widest" for="email">Email Address</label>
<div class="relative glow-effect rounded-md transition-all duration-300 border border-surface-container-high bg-[#0D0D0D]">
<input class="w-full bg-transparent border-none text-on-surface font-body-md text-body-md focus:ring-0 py-3 px-4 placeholder-on-surface-variant/50" id="email" placeholder="john.doe@example.com" type="email">
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-widest" for="password">Password</label>
<div class="relative glow-effect rounded-md transition-all duration-300 border border-surface-container-high bg-[#0D0D0D]">
<input class="w-full bg-transparent border-none text-on-surface font-mono-data text-mono-data focus:ring-0 py-3 px-4 placeholder-on-surface-variant/50" id="password" placeholder="••••••••" type="password">
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-widest" for="confirmPassword">Confirm Password</label>
<div class="relative glow-effect rounded-md transition-all duration-300 border border-surface-container-high bg-[#0D0D0D]">
<input class="w-full bg-transparent border-none text-on-surface font-mono-data text-mono-data focus:ring-0 py-3 px-4 placeholder-on-surface-variant/50" id="confirmPassword" placeholder="••••••••" type="password">
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start mt-6">
<div class="flex items-center h-5">
<input class="w-4 h-4 bg-surface-container-high border-outline-variant rounded focus:ring-primary focus:ring-2 focus:ring-offset-2 focus:ring-offset-background text-primary-container transition-colors cursor-pointer" id="terms" type="checkbox">
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:text-primary-fixed transition-colors underline decoration-primary/30 underline-offset-4" href="#">Terms of Service</a> and <a class="text-primary hover:text-primary-fixed transition-colors underline decoration-primary/30 underline-offset-4" href="#">Privacy Policy</a>.
                    </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:bg-[#F5C542] text-[#131313] font-headline-md text-body-lg font-bold py-4 px-6 rounded-lg transition-all duration-300 hover:shadow-[0px_4px_20px_rgba(212,175,55,0.3)] hover:-translate-y-0.5 transform active:scale-95 mt-stack-md flex justify-center items-center gap-2" type="submit">
                Create Account
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Sign In Link -->
<div class="mt-8 text-center border-t border-outline-variant/30 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary hover:text-primary-fixed font-bold transition-colors ml-1" href="#">Sign In</a>
</p>
</div>
</div>
